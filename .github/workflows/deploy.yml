name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Build Check & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify NestJS Build
        run: npm run build

      - name: Deploy to AWS EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "⚠️ EC2_HOST or EC2_SSH_KEY secret is not configured yet in GitHub Repository Secrets."
            echo "✅ Build & Prisma checks succeeded! Add EC2_HOST, EC2_USER, and EC2_SSH_KEY under Repo Settings -> Secrets -> Actions to enable EC2 auto-deploy."
            exit 0
          fi

          SSH_USER="${EC2_USER:-ubuntu}"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"

          ssh $SSH_OPTS "${SSH_USER}@${EC2_HOST}" \
            "mkdir -p ~/nook-backend && (command -v rsync >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq rsync))"

          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            -e "ssh $SSH_OPTS" \
            ./ "${SSH_USER}@${EC2_HOST}:~/nook-backend/"

          ssh $SSH_OPTS "${SSH_USER}@${EC2_HOST}" 'bash -s' << 'EOF'
            set -e
            cd ~/nook-backend
            npm ci
            npx prisma generate
            npx prisma db push
            npm run build
            pm2 restart nook-backend --update-env || pm2 start dist/main.js --name nook-backend
            pm2 save
          EOF

          rm -f ~/.ssh/deploy_key
